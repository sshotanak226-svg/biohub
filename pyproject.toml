[project]
name = "biohub"
version = "0.1.0"
description = "Reproducible local demo and Kaggle inference pipeline for Biohub cell tracking"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "blosc2>=4.10.1",
    "dask[array]>=2026.7.1",
    "geff>=1.1.3.1.1",
    "geff-spec<1.2",
    "ilpy>=0.6.0",
    "imagecodecs>=2026.3.6",
    "imageio>=2.37.4",
    "ipykernel>=7.3.0",
    "joblib>=1.5.3",
    "kaggle>=2.2.4",
    "kagglehub>=1.0.1",
    "matplotlib>=3.11.1",
    "nbclient>=0.11.0",
    "nbconvert>=7.17.1",
    "nbformat>=5.10.4",
    "numpy>=2.4.6",
    "pandas>=3.0.5",
    "polars>=1.36",
    "pyarrow>=25.0.0",
    "pyscipopt>=6.2.1",
    "pyyaml>=6.0",
    "pytest>=9.1.1",
    "rustworkx>=0.17.1",
    "scikit-image>=0.24",
    "scipy>=1.17.1",
    "sqlalchemy>=2.0.51",
    "torch>=2.9.1",
    "tqdm>=4.70.0",
    "tracksdata",
    "zarr>=3.0.10,<4",
]

[project.scripts]
biohub-local = "biohub_demo.run:main"
biohub-kaggle = "biohub_demo.kaggle:main"
biohub-train-eval = "biohub_demo.train_eval:main"
biohub-local-search = "biohub_demo.tune:main"
biohub-hyper-search = "biohub_demo.hyper_search:main"
biohub-method-search = "biohub_demo.method_search:main"
biohub-proposal-search = "biohub_demo.proposal_search:main"
biohub-literature-search = "biohub_demo.literature_search:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/biohub_demo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.uv.sources]
tracksdata = { git = "https://github.com/royerlab/tracksdata", rev = "main" }
torch = { index = "pytorch-cu130" }

[tool.uv]
cache-dir = ".uv-cache"

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
